name: deploy-to-vps

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push with cache
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/mvp-englishintg-api"
          
          docker buildx build \
            --cache-from type=registry,ref=${IMAGE_NAME}:cache \
            --cache-to type=registry,ref=${IMAGE_NAME}:cache,mode=max \
            --tag ${IMAGE_NAME}:latest \
            --tag ${IMAGE_NAME}:${{ github.sha }} \
            --push \
            .

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to VPS (with connectivity diagnostics + retry)
        run: |
          set -euo pipefail

          # Подготавливаем docker-compose.prod.yml
          sed "s|\${GITHUB_REPOSITORY_OWNER}|${{ github.repository_owner }}|g" docker-compose.prod.yml > docker-compose.prod-temp.yml

          echo "== DNS/TCP diagnostics =="
          getent hosts "${{ secrets.SSH_HOST }}" || true
          for i in 1 2 3; do
            echo "TCP check attempt $i"
            timeout 8 bash -lc "cat < /dev/null > /dev/tcp/${{ secrets.SSH_HOST }}/22" && break || sleep 5
          done

          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=6"

          # Retry wrapper
          retry() {
            local n=1
            local max=4
            local delay=10
            while true; do
              "$@" && break || {
                if [[ $n -lt $max ]]; then
                  echo "Command failed. Attempt $n/$max. Retrying in ${delay}s..."
                  n=$((n+1))
                  sleep $delay
                else
                  echo "Command failed after $n attempts."
                  return 1
                fi
              }
            done
          }

          echo "== Upload compose file =="
          retry scp $SSH_OPTS docker-compose.prod-temp.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/mvp-englishintg-api/docker-compose.prod.yml

          echo "== Remote deploy =="
          retry ssh $SSH_OPTS ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'cd /opt/mvp-englishintg-api && \
             echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin && \
             sudo docker network create db_default >/dev/null 2>&1 || true && \
             sudo docker network connect --alias mongodb db_default mongodb-local >/dev/null 2>&1 || true && \
             sudo docker compose -f docker-compose.prod.yml pull && \
             sudo docker rm -f english-api >/dev/null 2>&1 || true && \
             sudo docker compose -f docker-compose.prod.yml up -d --force-recreate && \
             sudo docker image prune -f'


